apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sqlserver
  namespace: three-tier
spec:
  serviceName: sqlserver
  replicas: 1

  selector:
    matchLabels:
      app: sqlserver

  template:
    metadata:
      labels:
        app: sqlserver

    spec:
      securityContext:
        fsGroup: 10001

      containers:
        - name: sqlserver

          image: mcr.microsoft.com/mssql/server:2022-latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: sql
              containerPort: 1433
              protocol: TCP

          env:
            - name: ACCEPT_EULA
              value: "Y"

            - name: MSSQL_PID
              value: "Developer"

            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: three-tier-db-secret
                  key: MSSQL_SA_PASSWORD

          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"

            limits:
              cpu: "1"
              memory: "2Gi"

          volumeMounts:
            - name: sqlserver-data
              mountPath: /var/opt/mssql

          readinessProbe:
            tcpSocket:
              port: sql
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            tcpSocket:
              port: sql
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

  volumeClaimTemplates:
    - metadata:
        name: sqlserver-data
      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 5Gi